<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" fill="none">
  <!-- Background with subtle gradient -->
  <rect width="800" height="480" rx="16" fill="#0d0d12"/>
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="rgba(255,255,255,0.08)"/>
  
  <!-- App Header Bar -->
  <rect x="24" y="24" width="752" height="48" rx="10" fill="#14141c" stroke="rgba(255,255,255,0.05)"/>
  <circle cx="50" cy="48" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="66" cy="48" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="82" cy="48" r="5" fill="#10b981" opacity="0.8"/>
  <text x="110" y="53" fill="#a1a1aa" font-family="'Space Mono', monospace" font-size="12">insightpulse / intelligence-engine v2.4</text>
  <rect x="630" y="36" width="130" height="24" rx="12" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.25)"/>
  <text x="645" y="52" fill="#00f0ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">● LIVE INGESTION</text>

  <!-- Left Column: Sentiment & Vector Cluster Matrix -->
  <rect x="24" y="88" width="460" height="368" rx="12" fill="#121218" stroke="rgba(255,255,255,0.04)"/>
  <text x="48" y="122" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Sentiment Distribution &amp; Review Clustering</text>
  <text x="48" y="142" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Aggregated 14,280 customer feedback vectors across 8 channels</text>

  <!-- Trend Graph -->
  <path d="M48 240 C 100 210, 160 260, 220 190 C 280 120, 360 170, 440 130" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M48 240 C 100 210, 160 260, 220 190 C 280 120, 360 170, 440 130 L 440 320 L 48 320 Z" fill="url(#pulse-gradient)" opacity="0.15"/>
  <defs>
    <linearGradient id="pulse-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Data Metric Cards -->
  <rect x="48" y="340" width="120" height="80" rx="8" fill="#181822"/>
  <text x="62" y="366" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">POSITIVE</text>
  <text x="62" y="400" fill="#10b981" font-family="'Syne', sans-serif" font-size="24" font-weight="800">88.4%</text>

  <rect x="184" y="340" width="120" height="80" rx="8" fill="#181822"/>
  <text x="198" y="366" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">LATENCY P95</text>
  <text x="198" y="400" fill="#00f0ff" font-family="'Syne', sans-serif" font-size="24" font-weight="800">142ms</text>

  <rect x="320" y="340" width="138" height="80" rx="8" fill="#181822"/>
  <text x="334" y="366" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">TOP ASPECT</text>
  <text x="334" y="398" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">UI Flow &amp; Speed</text>

  <!-- Right Column: Real-time Ingest Feed -->
  <rect x="500" y="88" width="276" height="368" rx="12" fill="#121218" stroke="rgba(255,255,255,0.04)"/>
  <text x="520" y="122" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Extracted Themes</text>

  <rect x="520" y="145" width="236" height="58" rx="8" fill="#181822" stroke="rgba(255,255,255,0.03)"/>
  <text x="532" y="168" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Checkout Performance</text>
  <text x="532" y="188" fill="#10b981" font-family="'Space Mono', monospace" font-size="10">+24% sentiment lift after patch</text>

  <rect x="520" y="215" width="236" height="58" rx="8" fill="#181822" stroke="rgba(255,255,255,0.03)"/>
  <text x="532" y="238" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Search Relevance</text>
  <text x="532" y="258" fill="#00f0ff" font-family="'Space Mono', monospace" font-size="10">Dense retrieval vector index</text>

  <rect x="520" y="285" width="236" height="58" rx="8" fill="#181822" stroke="rgba(255,255,255,0.03)"/>
  <text x="532" y="308" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Mobile Onboarding</text>
  <text x="532" y="328" fill="#a1a1aa" font-family="'Space Mono', monospace" font-size="10">Identified 3 friction points</text>

  <rect x="520" y="355" width="236" height="65" rx="8" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.2)"/>
  <text x="532" y="380" fill="#00f0ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Auto-Generated Summary</text>
  <text x="532" y="400" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">High satisfaction across search &amp; checkout.</text>
</svg>
